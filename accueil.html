<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fon IA — Accueil</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;color:#0f172a;
background:radial-gradient(circle at 15% 10%,#e0f2fe 0,transparent 45%),radial-gradient(circle at 85% 90%,#dbeafe 0,transparent 45%),#fff}
h1{font-size:clamp(1.6rem,4vw,2.4rem);text-align:center}
h1 span{background:linear-gradient(135deg,#38bdf8,#1d4ed8);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sub{color:#64748b;margin:8px 0 36px;text-align:center}
.cartes{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:22px;width:100%;max-width:760px}
a.carte{display:block;text-decoration:none;color:inherit;background:#fff;border:1px solid #e2e8f0;border-radius:24px;padding:34px 28px;
box-shadow:0 10px 30px rgba(29,78,216,.08);transition:transform .25s,box-shadow .25s,border-color .25s}
a.carte:hover{transform:translateY(-6px);box-shadow:0 18px 40px rgba(29,78,216,.18);border-color:#38bdf8}
.ico{font-size:2.6rem;margin-bottom:14px}
.carte h2{font-size:1.25rem;margin-bottom:8px}
.carte p{color:#64748b;line-height:1.5;font-size:.95rem}
.go{display:inline-block;margin-top:18px;font-weight:700;color:#1d4ed8}
.bas{margin-top:34px;font-size:.85rem;color:#94a3b8}
.bas a{color:#1d4ed8;cursor:pointer;text-decoration:underline}
</style>
</head>
<body>
<h1>Bienvenue <span id="nom"></span></h1>
<p class="sub">Que veux-tu faire aujourd'hui ?</p>
<div class="cartes">
  <a class="carte" href="index.html#ia"><div class="ico">💬</div><h2>Parler avec l'IA</h2><p>Écris en Fon ou en français avec ton clavier Fon et discute avec l'assistant.</p><span class="go">Ouvrir le chat →</span></a>
  <a class="carte" href="apprendre.html"><div class="ico">📚</div><h2>Apprendre le Fon</h2><p>Leçons par thèmes, quiz et mot du jour pour progresser pas à pas.</p><span class="go">Commencer →</span></a>
</div>
<p class="bas">© 2026 Fon IA · <a onclick="sortir()">Se déconnecter</a></p>
<script>
const cle=Object.keys(localStorage).find(k=>/^sb-.*-auth-token$/.test(k));
if(!cle){location.replace('index.html');}
else{try{const u=JSON.parse(localStorage.getItem(cle)).user;document.getElementById('nom').textContent=(u.user_metadata?.full_name||'').split(' ')[0];}catch(e){}}
function sortir(){if(!confirm('Voulez-vous vraiment vous déconnecter ?'))return;
Object.keys(localStorage).filter(k=>/^sb-.*-auth-token$/.test(k)).forEach(k=>localStorage.removeItem(k));location.replace('index.html');}
</script>
</body>
</html>
